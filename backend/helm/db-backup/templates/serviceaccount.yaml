{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "db-backup.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db-backup.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken | default false }}
{{- end }}

---

{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "db-backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db-backup.labels" . | nindent 4 }}
rules:
  # Allow reading secrets for database credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  # Allow reading configmaps for configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  # Allow creating events for auditing
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Allow reading pods for job status
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Allow creating/managing backup jobs
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Allow reading PVCs for backup
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "db-backup.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db-backup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "db-backup.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "db-backup.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
