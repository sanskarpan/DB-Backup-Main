{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "db-backup.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "db-backup.labels" . | nindent 4 }}
type: Opaque
stringData:
  # JWT secret for authentication
  JWT_SECRET: {{ .Values.secrets.jwtSecret | default "change-this-to-a-secure-random-string-min-32-chars" | quote }}

  # AWS credentials
  {{- if .Values.secrets.awsAccessKeyId }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  {{- end }}
  {{- if .Values.secrets.awsSecretAccessKey }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.awsRegion }}
  AWS_REGION: {{ .Values.secrets.awsRegion | quote }}
  {{- end }}

  # Azure credentials
  {{- if .Values.secrets.azureStorageAccount }}
  AZURE_STORAGE_ACCOUNT: {{ .Values.secrets.azureStorageAccount | quote }}
  {{- end }}
  {{- if .Values.secrets.azureStorageKey }}
  AZURE_STORAGE_KEY: {{ .Values.secrets.azureStorageKey | quote }}
  {{- end }}
  {{- if .Values.secrets.azureStorageConnectionString }}
  AZURE_STORAGE_CONNECTION_STRING: {{ .Values.secrets.azureStorageConnectionString | quote }}
  {{- end }}

  # GCP credentials
  {{- if .Values.secrets.gcpProjectId }}
  GCP_PROJECT_ID: {{ .Values.secrets.gcpProjectId | quote }}
  {{- end }}
  {{- if .Values.secrets.gcpServiceAccountKey }}
  GCP_SERVICE_ACCOUNT_KEY: {{ .Values.secrets.gcpServiceAccountKey | quote }}
  {{- end }}

  # PostgreSQL credentials
  {{- if .Values.secrets.postgresHost }}
  POSTGRES_HOST: {{ .Values.secrets.postgresHost | quote }}
  {{- end }}
  {{- if .Values.secrets.postgresPort }}
  POSTGRES_PORT: {{ .Values.secrets.postgresPort | quote }}
  {{- end }}
  {{- if .Values.secrets.postgresUser }}
  POSTGRES_USER: {{ .Values.secrets.postgresUser | quote }}
  {{- end }}
  {{- if .Values.secrets.postgresPassword }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.postgresDatabase }}
  POSTGRES_DB: {{ .Values.secrets.postgresDatabase | quote }}
  {{- end }}

  # MySQL credentials
  {{- if .Values.secrets.mysqlHost }}
  MYSQL_HOST: {{ .Values.secrets.mysqlHost | quote }}
  {{- end }}
  {{- if .Values.secrets.mysqlPort }}
  MYSQL_PORT: {{ .Values.secrets.mysqlPort | quote }}
  {{- end }}
  {{- if .Values.secrets.mysqlUser }}
  MYSQL_USER: {{ .Values.secrets.mysqlUser | quote }}
  {{- end }}
  {{- if .Values.secrets.mysqlPassword }}
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.mysqlDatabase }}
  MYSQL_DATABASE: {{ .Values.secrets.mysqlDatabase | quote }}
  {{- end }}

  # MongoDB credentials
  {{- if .Values.secrets.mongodbUri }}
  MONGODB_URI: {{ .Values.secrets.mongodbUri | quote }}
  {{- end }}
  {{- if .Values.secrets.mongodbHost }}
  MONGODB_HOST: {{ .Values.secrets.mongodbHost | quote }}
  {{- end }}
  {{- if .Values.secrets.mongodbPort }}
  MONGODB_PORT: {{ .Values.secrets.mongodbPort | quote }}
  {{- end }}
  {{- if .Values.secrets.mongodbUser }}
  MONGODB_USER: {{ .Values.secrets.mongodbUser | quote }}
  {{- end }}
  {{- if .Values.secrets.mongodbPassword }}
  MONGODB_PASSWORD: {{ .Values.secrets.mongodbPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.mongodbDatabase }}
  MONGODB_DATABASE: {{ .Values.secrets.mongodbDatabase | quote }}
  {{- end }}

  # Encryption key for backup encryption
  {{- if .Values.secrets.encryptionKey }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- end }}

  # Webhook secret for notifications
  {{- if .Values.secrets.webhookSecret }}
  WEBHOOK_SECRET: {{ .Values.secrets.webhookSecret | quote }}
  {{- end }}

  # Vault credentials for secret management
  {{- if .Values.secrets.vaultAddr }}
  VAULT_ADDR: {{ .Values.secrets.vaultAddr | quote }}
  {{- end }}
  {{- if .Values.secrets.vaultToken }}
  VAULT_TOKEN: {{ .Values.secrets.vaultToken | quote }}
  {{- end }}
  {{- if .Values.secrets.vaultNamespace }}
  VAULT_NAMESPACE: {{ .Values.secrets.vaultNamespace | quote }}
  {{- end }}

  # Elasticsearch credentials
  {{- if .Values.secrets.elasticsearchUrl }}
  ELASTICSEARCH_URL: {{ .Values.secrets.elasticsearchUrl | quote }}
  {{- end }}
  {{- if .Values.secrets.elasticsearchUsername }}
  ELASTICSEARCH_USERNAME: {{ .Values.secrets.elasticsearchUsername | quote }}
  {{- end }}
  {{- if .Values.secrets.elasticsearchPassword }}
  ELASTICSEARCH_PASSWORD: {{ .Values.secrets.elasticsearchPassword | quote }}
  {{- end }}
{{- end }}
