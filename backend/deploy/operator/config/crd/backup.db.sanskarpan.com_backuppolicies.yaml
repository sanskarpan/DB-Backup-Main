apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backuppolicies.backup.db.sanskarpan.com
  annotations:
    controller-gen.kubebuilder.io/version: v0.13.0
spec:
  group: backup.db.sanskarpan.com
  names:
    kind: BackupPolicy
    listKind: BackupPolicyList
    plural: backuppolicies
    singular: backuppolicy
    shortNames:
      - bp
      - bpolicy
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          description: BackupPolicy defines a backup policy for database backups
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              description: BackupPolicySpec defines the desired state of BackupPolicy
              type: object
              required:
                - databaseType
                - retention
              properties:
                databaseType:
                  description: Type of database (postgres, mysql, mongodb, sqlite)
                  type: string
                  enum:
                    - postgres
                    - mysql
                    - mongodb
                    - sqlite
                databaseRef:
                  description: Reference to database credentials
                  type: object
                  required:
                    - secretName
                  properties:
                    secretName:
                      description: Name of secret containing database credentials
                      type: string
                    namespace:
                      description: Namespace of the secret (defaults to policy namespace)
                      type: string
                backupType:
                  description: Type of backup (full, incremental, differential)
                  type: string
                  enum:
                    - full
                    - incremental
                    - differential
                  default: full
                schedule:
                  description: Cron schedule for automated backups
                  type: string
                  pattern: '^(@(annually|yearly|monthly|weekly|daily|hourly|reboot))|(@every (\d+(ns|us|µs|ms|s|m|h))+)|((((\d+,)+\d+|(\d+(\/|-)\d+)|\d+|\*) ?){5,7})$'
                retention:
                  description: Retention policy for backups
                  type: object
                  required:
                    - daily
                  properties:
                    daily:
                      description: Number of daily backups to retain
                      type: integer
                      minimum: 1
                      maximum: 365
                    weekly:
                      description: Number of weekly backups to retain
                      type: integer
                      minimum: 0
                      maximum: 52
                    monthly:
                      description: Number of monthly backups to retain
                      type: integer
                      minimum: 0
                      maximum: 120
                    yearly:
                      description: Number of yearly backups to retain
                      type: integer
                      minimum: 0
                      maximum: 100
                storage:
                  description: Storage configuration for backups
                  type: object
                  required:
                    - provider
                  properties:
                    provider:
                      description: Storage provider (s3, azure, gcp, local)
                      type: string
                      enum:
                        - s3
                        - azure
                        - gcp
                        - local
                    bucket:
                      description: Storage bucket name
                      type: string
                    region:
                      description: Storage region
                      type: string
                    path:
                      description: Base path for backups
                      type: string
                    secretName:
                      description: Secret containing storage credentials
                      type: string
                compression:
                  description: Compression settings
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    algorithm:
                      description: Compression algorithm (gzip, zstd, lz4)
                      type: string
                      enum:
                        - gzip
                        - zstd
                        - lz4
                      default: zstd
                    level:
                      description: Compression level (1-9 for gzip, 1-22 for zstd)
                      type: integer
                      minimum: 1
                      maximum: 22
                      default: 3
                encryption:
                  description: Encryption settings
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    algorithm:
                      description: Encryption algorithm (aes-256-gcm, chacha20-poly1305)
                      type: string
                      enum:
                        - aes-256-gcm
                        - chacha20-poly1305
                      default: aes-256-gcm
                    keySecretName:
                      description: Secret containing encryption key
                      type: string
                verification:
                  description: Backup verification settings
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    method:
                      description: Verification method (checksum, restore-test)
                      type: string
                      enum:
                        - checksum
                        - restore-test
                      default: checksum
                notifications:
                  description: Notification settings
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    webhookURL:
                      description: Webhook URL for notifications
                      type: string
                    onSuccess:
                      type: boolean
                      default: false
                    onFailure:
                      type: boolean
                      default: true
                parallelism:
                  description: Number of parallel backup jobs
                  type: integer
                  minimum: 1
                  maximum: 10
                  default: 1
                timeoutSeconds:
                  description: Timeout for backup operations
                  type: integer
                  minimum: 60
                  maximum: 86400
                  default: 3600
                suspended:
                  description: Suspend scheduled backups
                  type: boolean
                  default: false
                tags:
                  description: Tags to attach to backups
                  type: object
                  additionalProperties:
                    type: string
            status:
              description: BackupPolicyStatus defines the observed state of BackupPolicy
              type: object
              properties:
                phase:
                  description: Current phase of the policy
                  type: string
                  enum:
                    - Active
                    - Suspended
                    - Failed
                conditions:
                  description: Conditions of the policy
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                lastBackupTime:
                  description: Time of last successful backup
                  type: string
                  format: date-time
                nextBackupTime:
                  description: Scheduled time for next backup
                  type: string
                  format: date-time
                totalBackups:
                  description: Total number of backups created
                  type: integer
                successfulBackups:
                  description: Number of successful backups
                  type: integer
                failedBackups:
                  description: Number of failed backups
                  type: integer
                lastBackupSize:
                  description: Size of last backup in bytes
                  type: integer
                  format: int64
                observedGeneration:
                  description: Most recent generation observed
                  type: integer
                  format: int64
      additionalPrinterColumns:
        - name: Database
          type: string
          jsonPath: .spec.databaseType
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Last Backup
          type: date
          jsonPath: .status.lastBackupTime
        - name: Next Backup
          type: date
          jsonPath: .status.nextBackupTime
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
