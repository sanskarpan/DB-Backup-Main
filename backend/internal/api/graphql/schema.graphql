# ============================================
# Payload Types
# ============================================

type BackupPayload {
  backup: Backup
  errors: [Error!]
}

type RestorePayload {
  restore: Restore
  errors: [Error!]
}

type SchedulePayload {
  schedule: Schedule
  errors: [Error!]
}

type DatabasePayload {
  database: Database
  errors: [Error!]
}

type StorageProviderPayload {
  storageProvider: StorageProvider
  errors: [Error!]
}

type RetentionPolicyPayload {
  retentionPolicy: RetentionPolicy
  errors: [Error!]
}

type NotificationPayload {
  notification: Notification
  errors: [Error!]
}

type UserPayload {
  user: User
  errors: [Error!]
}

type TeamPayload {
  team: Team
  errors: [Error!]
}

type DeletePayload {
  success: Boolean!
  errors: [Error!]
}

type BulkOperationResult {
  successCount: Int!
  failureCount: Int!
  errors: [Error!]
}

type ConnectionTestResult {
  success: Boolean!
  message: String!
  version: String
  latency: Duration
}

type Error {
  message: String!
  path: [String!]
  extensions: JSON
}

# ============================================
# Pagination Types
# ============================================

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

# ============================================
# Subscription Event Types
# ============================================

type BackupStatusEvent {
  backup: Backup!
  previousStatus: BackupStatus!
  newStatus: BackupStatus!
  timestamp: DateTime!
}

type RestoreProgressEvent {
  restore: Restore!
  progress: Float!
  estimatedTimeRemaining: Duration
  timestamp: DateTime!
}
