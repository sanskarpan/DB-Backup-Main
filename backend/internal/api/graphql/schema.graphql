# DB Backup GraphQL Schema
# Comprehensive schema with all entities and operations

# ============================================
# Directives
# ============================================

directive @auth(requires: Role = USER) on OBJECT | FIELD_DEFINITION
directive @rateLimit(limit: Int!, window: Int!) on FIELD_DEFINITION
directive @complexity(value: Int!) on FIELD_DEFINITION
directive @deprecated(reason: String!) on FIELD_DEFINITION | ENUM_VALUE
directive @cacheControl(maxAge: Int!, scope: CacheControlScope = PUBLIC) on FIELD_DEFINITION | OBJECT

enum CacheControlScope {
  PUBLIC
  PRIVATE
}

enum Role {
  GUEST
  USER
  ADMIN
  SUPER_ADMIN
}

# ============================================
# Scalars
# ============================================

scalar DateTime
scalar Upload
scalar JSON
scalar Duration
scalar ByteSize

# ============================================
# Core Types
# ============================================

type Query {
  # Backup operations
  backup(id: ID!): Backup @auth(requires: USER) @cacheControl(maxAge: 60)
  backups(
    filter: BackupFilter
    sort: BackupSort
    pagination: PaginationInput
  ): BackupConnection! @auth(requires: USER) @complexity(value: 10)

  # Restore operations
  restore(id: ID!): Restore @auth(requires: USER)
  restores(
    filter: RestoreFilter
    sort: RestoreSort
    pagination: PaginationInput
  ): RestoreConnection! @auth(requires: USER)

  # Schedule operations
  schedule(id: ID!): Schedule @auth(requires: USER)
  schedules(
    filter: ScheduleFilter
    pagination: PaginationInput
  ): ScheduleConnection! @auth(requires: USER)

  # Database operations
  database(id: ID!): Database @auth(requires: USER)
  databases(
    filter: DatabaseFilter
    pagination: PaginationInput
  ): DatabaseConnection! @auth(requires: USER)

  # Storage providers
  storageProvider(id: ID!): StorageProvider @auth(requires: USER)
  storageProviders: [StorageProvider!]! @auth(requires: USER)

  # Policies
  retentionPolicy(id: ID!): RetentionPolicy @auth(requires: USER)
  retentionPolicies: [RetentionPolicy!]! @auth(requires: USER)

  # Monitoring
  systemHealth: SystemHealth! @auth(requires: USER) @cacheControl(maxAge: 10)
  metrics(
    timeRange: TimeRangeInput!
    metricTypes: [MetricType!]
  ): [Metric!]! @auth(requires: USER)

  # Analytics
  backupStatistics(timeRange: TimeRangeInput!): BackupStatistics! @auth(requires: USER)
  storageUsage(groupBy: StorageGroupBy): [StorageUsageItem!]! @auth(requires: USER)

  # Notifications
  notifications(
    filter: NotificationFilter
    pagination: PaginationInput
  ): NotificationConnection! @auth(requires: USER)

  # Users and Teams
  me: User! @auth(requires: USER)
  user(id: ID!): User @auth(requires: ADMIN)
  users(pagination: PaginationInput): UserConnection! @auth(requires: ADMIN)
  team(id: ID!): Team @auth(requires: USER)
  teams: [Team!]! @auth(requires: USER)

  # Audit logs
  auditLogs(
    filter: AuditLogFilter
    pagination: PaginationInput
  ): AuditLogConnection! @auth(requires: ADMIN)

  # Search
  search(query: String!, types: [SearchType!]): SearchResults! @auth(requires: USER) @complexity(value: 20)
}

type Mutation {
  # Backup mutations
  createBackup(input: CreateBackupInput!): BackupPayload! @auth(requires: USER) @rateLimit(limit: 10, window: 60)
  updateBackup(id: ID!, input: UpdateBackupInput!): BackupPayload! @auth(requires: USER)
  deleteBackup(id: ID!): DeletePayload! @auth(requires: USER)

  # Restore mutations
  createRestore(input: CreateRestoreInput!): RestorePayload! @auth(requires: USER) @rateLimit(limit: 5, window: 60)
  cancelRestore(id: ID!): RestorePayload! @auth(requires: USER)

  # Schedule mutations
  createSchedule(input: CreateScheduleInput!): SchedulePayload! @auth(requires: USER)
  updateSchedule(id: ID!, input: UpdateScheduleInput!): SchedulePayload! @auth(requires: USER)
  deleteSchedule(id: ID!): DeletePayload! @auth(requires: USER)
  toggleSchedule(id: ID!, enabled: Boolean!): SchedulePayload! @auth(requires: USER)

  # Database mutations
  addDatabase(input: AddDatabaseInput!): DatabasePayload! @auth(requires: USER)
  updateDatabase(id: ID!, input: UpdateDatabaseInput!): DatabasePayload! @auth(requires: USER)
  removeDatabase(id: ID!): DeletePayload! @auth(requires: USER)
  testDatabaseConnection(input: TestConnectionInput!): ConnectionTestResult! @auth(requires: USER)

  # Storage provider mutations
  addStorageProvider(input: AddStorageProviderInput!): StorageProviderPayload! @auth(requires: ADMIN)
  updateStorageProvider(id: ID!, input: UpdateStorageProviderInput!): StorageProviderPayload! @auth(requires: ADMIN)
  removeStorageProvider(id: ID!): DeletePayload! @auth(requires: ADMIN)

  # Retention policy mutations
  createRetentionPolicy(input: CreateRetentionPolicyInput!): RetentionPolicyPayload! @auth(requires: USER)
  updateRetentionPolicy(id: ID!, input: UpdateRetentionPolicyInput!): RetentionPolicyPayload! @auth(requires: USER)
  deleteRetentionPolicy(id: ID!): DeletePayload! @auth(requires: USER)

  # Notification mutations
  markNotificationRead(id: ID!): NotificationPayload! @auth(requires: USER)
  markAllNotificationsRead: BulkOperationResult! @auth(requires: USER)
  deleteNotification(id: ID!): DeletePayload! @auth(requires: USER)

  # User mutations
  updateProfile(input: UpdateProfileInput!): UserPayload! @auth(requires: USER)
  updatePreferences(input: UpdatePreferencesInput!): UserPayload! @auth(requires: USER)
  changePassword(input: ChangePasswordInput!): UserPayload! @auth(requires: USER)

  # Team mutations
  createTeam(input: CreateTeamInput!): TeamPayload! @auth(requires: ADMIN)
  updateTeam(id: ID!, input: UpdateTeamInput!): TeamPayload! @auth(requires: ADMIN)
  deleteTeam(id: ID!): DeletePayload! @auth(requires: ADMIN)
  addTeamMember(teamId: ID!, userId: ID!, role: TeamRole!): TeamPayload! @auth(requires: ADMIN)
  removeTeamMember(teamId: ID!, userId: ID!): TeamPayload! @auth(requires: ADMIN)

  # Batch operations
  batchDeleteBackups(ids: [ID!]!): BulkOperationResult! @auth(requires: USER)
  batchUpdateBackups(ids: [ID!]!, input: UpdateBackupInput!): BulkOperationResult! @auth(requires: USER)

  # File upload
  uploadBackup(file: Upload!, metadata: BackupMetadataInput): BackupPayload! @auth(requires: USER)
}

type Subscription {
  # Real-time backup updates
  backupStatusChanged(backupId: ID): BackupStatusEvent! @auth(requires: USER)

  # Real-time restore updates
  restoreProgress(restoreId: ID!): RestoreProgressEvent! @auth(requires: USER)

  # System notifications
  notificationReceived: Notification! @auth(requires: USER)

  # System health updates
  systemHealthChanged: SystemHealth! @auth(requires: ADMIN)

  # Metric updates
  metricsUpdated(metricTypes: [MetricType!]): [Metric!]! @auth(requires: USER)
}

# ============================================
# Backup Types
# ============================================

type Backup {
  id: ID!
  database: Database!
  name: String!
  status: BackupStatus!
  type: BackupType!
  size: ByteSize!
  compressedSize: ByteSize
  startTime: DateTime!
  endTime: DateTime
  duration: Duration
  location: String!
  storageProvider: StorageProvider!
  checksums: [Checksum!]!
  encryption: EncryptionInfo
  retentionPolicy: RetentionPolicy
  tags: [String!]!
  metadata: JSON
  createdBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Computed fields
  isIncremental: Boolean!
  canRestore: Boolean!
  expiresAt: DateTime

  # Relations
  restores: [Restore!]!
  schedule: Schedule
}

enum BackupStatus {
  PENDING
  IN_PROGRESS
  COMPLETED
  FAILED
  EXPIRED
  DELETED
}

enum BackupType {
  FULL
  INCREMENTAL
  DIFFERENTIAL
  SNAPSHOT
  CONTINUOUS
}

type Checksum {
  algorithm: String!
  value: String!
}

type EncryptionInfo {
  enabled: Boolean!
  algorithm: String
  keyId: String
}

input BackupFilter {
  databaseIds: [ID!]
  statuses: [BackupStatus!]
  types: [BackupType!]
  startTimeFrom: DateTime
  startTimeTo: DateTime
  tags: [String!]
  search: String
}

input BackupSort {
  field: BackupSortField!
  direction: SortDirection!
}

enum BackupSortField {
  START_TIME
  SIZE
  DURATION
  NAME
  STATUS
}

enum SortDirection {
  ASC
  DESC
}

type BackupConnection {
  edges: [BackupEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type BackupEdge {
  node: Backup!
  cursor: String!
}

# ============================================
# Restore Types
# ============================================

type Restore {
  id: ID!
  backup: Backup!
  targetDatabase: Database!
  status: RestoreStatus!
  progress: Float!
  startTime: DateTime!
  endTime: DateTime
  duration: Duration
  pointInTime: DateTime
  options: RestoreOptions!
  error: String
  createdBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum RestoreStatus {
  PENDING
  VALIDATING
  IN_PROGRESS
  COMPLETED
  FAILED
  CANCELLED
}

type RestoreOptions {
  validateBackup: Boolean!
  dropExisting: Boolean!
  parallel: Int!
  tables: [String!]
  excludeTables: [String!]
}

input RestoreFilter {
  backupIds: [ID!]
  statuses: [RestoreStatus!]
  startTimeFrom: DateTime
  startTimeTo: DateTime
}

input RestoreSort {
  field: RestoreSortField!
  direction: SortDirection!
}

enum RestoreSortField {
  START_TIME
  PROGRESS
  STATUS
}

type RestoreConnection {
  edges: [RestoreEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type RestoreEdge {
  node: Restore!
  cursor: String!
}

# ============================================
# Schedule Types
# ============================================

type Schedule {
  id: ID!
  name: String!
  database: Database!
  enabled: Boolean!
  cronExpression: String!
  nextRun: DateTime
  lastRun: DateTime
  backupType: BackupType!
  retentionPolicy: RetentionPolicy
  storageProvider: StorageProvider!
  options: ScheduleOptions!
  createdBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  backups: [Backup!]!

  # Computed
  upcomingRuns(count: Int = 5): [DateTime!]!
}

type ScheduleOptions {
  compression: CompressionType!
  encryption: Boolean!
  parallel: Int!
  tags: [String!]!
  notifyOnSuccess: Boolean!
  notifyOnFailure: Boolean!
}

enum CompressionType {
  NONE
  GZIP
  ZSTD
  LZ4
}

input ScheduleFilter {
  databaseIds: [ID!]
  enabled: Boolean
}

type ScheduleConnection {
  edges: [ScheduleEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type ScheduleEdge {
  node: Schedule!
  cursor: String!
}

# ============================================
# Database Types
# ============================================

type Database {
  id: ID!
  name: String!
  type: DatabaseType!
  host: String!
  port: Int!
  username: String!
  sslMode: SSLMode!
  status: DatabaseStatus!
  version: String
  size: ByteSize
  lastBackup: Backup
  tags: [String!]!
  createdBy: User!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  backups(limit: Int): [Backup!]!
  schedules: [Schedule!]!

  # Computed
  backupCount: Int!
  totalBackupSize: ByteSize!
  healthStatus: HealthStatus!
}

enum DatabaseType {
  MYSQL
  POSTGRESQL
  MONGODB
  REDIS
  ELASTICSEARCH
  CASSANDRA
  INFLUXDB
  DYNAMODB
  SQLITE
  TIMESCALEDB
}

enum SSLMode {
  DISABLE
  REQUIRE
  VERIFY_CA
  VERIFY_FULL
}

enum DatabaseStatus {
  CONNECTED
  DISCONNECTED
  ERROR
  TESTING
}

enum HealthStatus {
  HEALTHY
  WARNING
  CRITICAL
  UNKNOWN
}

input DatabaseFilter {
  types: [DatabaseType!]
  statuses: [DatabaseStatus!]
  tags: [String!]
  search: String
}

type DatabaseConnection {
  edges: [DatabaseEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type DatabaseEdge {
  node: Database!
  cursor: String!
}

# ============================================
# Storage Provider Types
# ============================================

type StorageProvider {
  id: ID!
  name: String!
  type: StorageType!
  config: JSON!
  isDefault: Boolean!
  capacity: ByteSize
  used: ByteSize
  available: ByteSize
  status: StorageStatus!
  createdAt: DateTime!
  updatedAt: DateTime!

  # Relations
  backups(limit: Int): [Backup!]!
}

enum StorageType {
  LOCAL
  S3
  GCS
  AZURE
  BACKBLAZE
  MINIO
  CEPH
  GLUSTERFS
}

enum StorageStatus {
  ONLINE
  OFFLINE
  DEGRADED
  FULL
}

# ============================================
# Retention Policy Types
# ============================================

type RetentionPolicy {
  id: ID!
  name: String!
  keepLast: Int
  keepDaily: Int
  keepWeekly: Int
  keepMonthly: Int
  keepYearly: Int
  minBackups: Int
  maxBackups: Int
  rules: [RetentionRule!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type RetentionRule {
  type: RetentionRuleType!
  value: Int!
  unit: TimeUnit!
}

enum RetentionRuleType {
  KEEP_LAST
  KEEP_FOR_DURATION
  DELETE_OLDER_THAN
}

enum TimeUnit {
  HOURS
  DAYS
  WEEKS
  MONTHS
  YEARS
}

# ============================================
# Monitoring Types
# ============================================

type SystemHealth {
  overall: HealthStatus!
  components: [ComponentHealth!]!
  uptime: Duration!
  timestamp: DateTime!
}

type ComponentHealth {
  name: String!
  status: HealthStatus!
  message: String
  metrics: JSON
}

type Metric {
  name: String!
  value: Float!
  unit: String!
  timestamp: DateTime!
  labels: JSON
}

enum MetricType {
  CPU_USAGE
  MEMORY_USAGE
  DISK_USAGE
  NETWORK_IO
  BACKUP_COUNT
  BACKUP_SIZE
  RESTORE_COUNT
  ERROR_RATE
  SUCCESS_RATE
}

input TimeRangeInput {
  from: DateTime!
  to: DateTime!
}

# ============================================
# Analytics Types
# ============================================

type BackupStatistics {
  totalBackups: Int!
  totalSize: ByteSize!
  averageSize: ByteSize!
  successRate: Float!
  failureRate: Float!
  averageDuration: Duration!
  backupsByType: [BackupTypeCount!]!
  backupsByStatus: [BackupStatusCount!]!
  backupTrend: [TrendDataPoint!]!
}

type BackupTypeCount {
  type: BackupType!
  count: Int!
  totalSize: ByteSize!
}

type BackupStatusCount {
  status: BackupStatus!
  count: Int!
}

type TrendDataPoint {
  timestamp: DateTime!
  value: Float!
}

type StorageUsageItem {
  label: String!
  size: ByteSize!
  count: Int!
  percentage: Float!
}

enum StorageGroupBy {
  DATABASE
  TYPE
  STATUS
  STORAGE_PROVIDER
}

# ============================================
# Notification Types
# ============================================

type Notification {
  id: ID!
  type: NotificationType!
  title: String!
  message: String!
  level: NotificationLevel!
  read: Boolean!
  metadata: JSON
  createdAt: DateTime!
}

enum NotificationType {
  BACKUP_SUCCESS
  BACKUP_FAILURE
  RESTORE_SUCCESS
  RESTORE_FAILURE
  SCHEDULE_TRIGGERED
  STORAGE_FULL
  DATABASE_DISCONNECTED
  SYSTEM_ALERT
}

enum NotificationLevel {
  INFO
  SUCCESS
  WARNING
  ERROR
  CRITICAL
}

input NotificationFilter {
  types: [NotificationType!]
  levels: [NotificationLevel!]
  read: Boolean
}

type NotificationConnection {
  edges: [NotificationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
  unreadCount: Int!
}

type NotificationEdge {
  node: Notification!
  cursor: String!
}

