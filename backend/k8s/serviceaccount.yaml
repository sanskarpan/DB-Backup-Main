apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-backup
  namespace: db-backup
  labels:
    app.kubernetes.io/name: db-backup
  annotations:
    # For AWS IRSA (IAM Roles for Service Accounts)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/db-backup-role

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-backup
  namespace: db-backup
  labels:
    app.kubernetes.io/name: db-backup
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-backup
  namespace: db-backup
  labels:
    app.kubernetes.io/name: db-backup
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: db-backup
subjects:
  - kind: ServiceAccount
    name: db-backup
    namespace: db-backup
