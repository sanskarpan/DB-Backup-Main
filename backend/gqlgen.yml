# gqlgen configuration for DB Backup GraphQL API

# Schema location
schema:
  - internal/api/graphql/schema.graphql

# Generated code locations
exec:
  filename: internal/api/graphql/generated/generated.go
  package: generated

model:
  filename: internal/api/graphql/resolvers/models_gen.go
  package: resolvers

resolver:
  layout: follow-schema
  dir: internal/api/graphql/resolvers
  package: resolvers
  filename_template: "{name}.resolvers.go"

# Model configuration
models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID

  DateTime:
    model:
      - github.com/sanskarpan/db-backup/internal/api/graphql/scalar.DateTime

  Upload:
    model:
      - github.com/99designs/gqlgen/graphql.Upload

  JSON:
    model:
      - github.com/sanskarpan/db-backup/internal/api/graphql/scalar.JSON

  Duration:
    model:
      - github.com/sanskarpan/db-backup/internal/api/graphql/scalar.Duration

  ByteSize:
    model:
      - github.com/sanskarpan/db-backup/internal/api/graphql/scalar.ByteSize

  # Map schema types to existing internal models where possible
  BackupStatus:
    model:
      - github.com/sanskarpan/db-backup/internal/database.BackupStatus

  RestoreStatus:
    model:
      - github.com/sanskarpan/db-backup/internal/database.RestoreStatus

  DatabaseType:
    model:
      - github.com/sanskarpan/db-backup/internal/database.DatabaseType

  CompressionType:
    model:
      - github.com/sanskarpan/db-backup/internal/types.CompressionType

# Skip resolvers for these fields (computed in model)
autobind:
  - github.com/sanskarpan/db-backup/internal/api/graphql/resolvers

# Omit specific resolvers
omit_slice_element_pointers: true
