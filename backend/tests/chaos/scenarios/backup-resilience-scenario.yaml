apiVersion: chaos-mesh.org/v1alpha1
kind: Workflow
metadata:
  name: backup-resilience-scenario
  namespace: chaos-testing
spec:
  entry: backup-under-stress
  templates:
    - name: backup-under-stress
      templateType: Serial
      deadline: 30m
      children:
        - initiate-backup
        - pod-failure-during-backup
        - network-delay-during-backup
        - cpu-stress-during-backup
        - verify-backup-completion

    - name: initiate-backup
      templateType: Task
      task:
        container:
          name: backup-trigger
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              curl -X POST http://db-backup-server:8080/api/v1/backups \
                -H "Content-Type: application/json" \
                -d '{"database":"test-db","type":"full"}'

    - name: pod-failure-during-backup
      templateType: PodChaos
      deadline: 2m
      podChaos:
        action: pod-failure
        mode: one
        duration: '30s'
        selector:
          namespaces:
            - db-backup
          labelSelectors:
            'app': 'db-backup-server'

    - name: network-delay-during-backup
      templateType: NetworkChaos
      deadline: 3m
      networkChaos:
        action: delay
        mode: all
        selector:
          namespaces:
            - db-backup
          labelSelectors:
            'app': 'db-backup-server'
        delay:
          latency: '200ms'
          jitter: '50ms'
        duration: '2m'

    - name: cpu-stress-during-backup
      templateType: StressChaos
      deadline: 4m
      stressChaos:
        mode: one
        selector:
          namespaces:
            - db-backup
          labelSelectors:
            'app': 'db-backup-server'
        stressors:
          cpu:
            workers: 2
            load: 90
        duration: '3m'

    - name: verify-backup-completion
      templateType: Task
      task:
        container:
          name: verify
          image: curlimages/curl:latest
          command:
            - /bin/sh
            - -c
            - |
              # Wait for backup to complete
              for i in $(seq 1 60); do
                STATUS=$(curl -s http://db-backup-server:8080/api/v1/backups/latest | grep -o '"status":"[^"]*"' | cut -d'"' -f4)
                if [ "$STATUS" = "completed" ] || [ "$STATUS" = "failed" ]; then
                  echo "Backup finished with status: $STATUS"
                  [ "$STATUS" = "completed" ] && exit 0 || exit 1
                fi
                sleep 5
              done
              echo "Backup timeout"
              exit 1
