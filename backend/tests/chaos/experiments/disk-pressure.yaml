apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: db-backup-disk-pressure
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
      - db-backup
    labelSelectors:
      'app': 'db-backup-server'
  stressors:
    workers:
      workers: 4
      size: '256MB'
      options:
        - '--hdd'
        - '1'
        - '--hdd-bytes'
        - '1GB'
  duration: '2m'
  scheduler:
    cron: '@every 8h'
