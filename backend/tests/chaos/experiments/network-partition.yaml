apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: db-backup-network-partition
  namespace: chaos-testing
spec:
  action: partition
  mode: all
  selector:
    namespaces:
      - db-backup
    labelSelectors:
      'app': 'db-backup-server'
  direction: both
  target:
    mode: all
    selector:
      namespaces:
        - db-backup
      labelSelectors:
        'app': 'postgres'
  duration: '1m'
  scheduler:
    cron: '@every 6h'
