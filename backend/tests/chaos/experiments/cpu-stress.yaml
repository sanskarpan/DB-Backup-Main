apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: db-backup-cpu-stress
  namespace: chaos-testing
spec:
  mode: one
  selector:
    namespaces:
      - db-backup
    labelSelectors:
      'app': 'db-backup-server'
  stressors:
    cpu:
      workers: 2
      load: 80
  duration: '3m'
  scheduler:
    cron: '@every 4h'
