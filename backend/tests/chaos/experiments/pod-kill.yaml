apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: db-backup-pod-kill
  namespace: chaos-testing
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces:
      - db-backup
    labelSelectors:
      'app': 'db-backup-server'
  gracePeriod: 0
  duration: '10s'
  scheduler:
    cron: '@every 3h'
