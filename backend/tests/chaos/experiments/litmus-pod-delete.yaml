apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: db-backup-pod-delete
  namespace: db-backup
spec:
  appinfo:
    appns: 'db-backup'
    applabel: 'app=db-backup-server'
    appkind: 'deployment'
  engineState: 'active'
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: '30'
            - name: CHAOS_INTERVAL
              value: '10'
            - name: FORCE
              value: 'false'
            - name: PODS_AFFECTED_PERC
              value: '50'
