apiVersion: v1
kind: Namespace
metadata:
  name: db-backup
  labels:
    name: db-backup
    app: db-backup
---
apiVersion: v1
kind: Secret
metadata:
  name: db-backup-secrets
  namespace: db-backup
type: Opaque
stringData:
  # Database credentials
  db-password: "REPLACE_WITH_DB_PASSWORD"
  postgres-password: "REPLACE_WITH_POSTGRES_PASSWORD"
  mongodb-password: "REPLACE_WITH_MONGODB_PASSWORD"

  # Encryption key (32 bytes base64 encoded)
  encryption-key: "REPLACE_WITH_ENCRYPTION_KEY"

  # AWS credentials
  aws-access-key-id: "REPLACE_WITH_AWS_ACCESS_KEY_ID"
  aws-secret-access-key: "REPLACE_WITH_AWS_SECRET_ACCESS_KEY"

  # Slack webhook (optional)
  slack-webhook-url: "REPLACE_WITH_SLACK_WEBHOOK_URL"

  # Email SMTP (optional)
  smtp-password: "REPLACE_WITH_SMTP_PASSWORD"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: db-backup-role
  namespace: db-backup
rules:
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: db-backup-rolebinding
  namespace: db-backup
subjects:
- kind: ServiceAccount
  name: db-backup
  namespace: db-backup
roleRef:
  kind: Role
  name: db-backup-role
  apiGroup: rbac.authorization.k8s.io
