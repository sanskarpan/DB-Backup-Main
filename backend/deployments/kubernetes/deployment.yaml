apiVersion: apps/v1
kind: Deployment
metadata:
  name: db-backup-server
  namespace: db-backup
  labels:
    app: db-backup
    component: server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: db-backup
      component: server
  template:
    metadata:
      labels:
        app: db-backup
        component: server
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: db-backup
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: db-backup-server
        image: db-backup:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        env:
        - name: DB_BACKUP_CONFIG
          value: /config/config.yaml
        - name: DB_BACKUP_LOG_LEVEL
          value: info
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-backup-secrets
              key: db-password
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: db-backup-secrets
              key: encryption-key
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: db-backup-secrets
              key: aws-access-key-id
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: db-backup-secrets
              key: aws-secret-access-key
              optional: true
        volumeMounts:
        - name: config
          mountPath: /config
          readOnly: true
        - name: backup-data
          mountPath: /data/backups
        - name: logs
          mountPath: /data/logs
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: db-backup-config
      - name: backup-data
        persistentVolumeClaim:
          claimName: db-backup-data-pvc
      - name: logs
        persistentVolumeClaim:
          claimName: db-backup-logs-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: db-backup-server
  namespace: db-backup
  labels:
    app: db-backup
    component: server
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: db-backup
    component: server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: db-backup
  namespace: db-backup
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-backup-config
  namespace: db-backup
data:
  config.yaml: |
    server:
      host: 0.0.0.0
      port: 8080

    logging:
      level: info
      format: json
      output: stdout
      rotation:
        enabled: false

    storage:
      provider: s3
      local:
        path: /data/backups
      s3:
        region: us-east-1
        bucket: db-backups
        endpoint: ""

    retention:
      enabled: true
      daily: 7
      weekly: 4
      monthly: 12

    notifications:
      enabled: false
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backup-data-pvc
  namespace: db-backup
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: db-backup-logs-pvc
  namespace: db-backup
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: standard
  resources:
    requests:
      storage: 10Gi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: db-backup-ingress
  namespace: db-backup
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - db-backup.example.com
    secretName: db-backup-tls
  rules:
  - host: db-backup.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: db-backup-server
            port:
              number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: db-backup-server-hpa
  namespace: db-backup
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: db-backup-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
