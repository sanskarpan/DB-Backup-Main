run:
  timeout: 10m
  issues-exit-code: 1
  tests: true
  modules-download-mode: readonly

output:
  formats:
    - format: colored-line-number
  sort-results: true

linters:
  enable:
    # Enabled by default
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - typecheck
    - unused

    # Additional
    - bodyclose
    - dupl
    - gocognit
    - goconst
    - gocyclo
    - gofmt
    - goimports
    - gosec
    - misspell
    - nolintlint
    - prealloc
    - revive
    - unconvert
    - unparam
    - whitespace

    # Best practices
    - errname
    - errorlint
    - forcetypeassert
    - gocritic
    - godot
    - gofumpt
    - gomoddirectives
    - gomodguard
    - goprintffuncname
    - importas
    - makezero
    - nakedret
    - nilerr
    - nilnil
    - noctx
    - nosprintfhostport
    - predeclared
    - reassign
    - stylecheck
    - tenv
    - testableexamples
    - thelper
    - tparallel
    - usestdlibvars
    - wastedassign

  disable:
    - exhaustruct
    - funlen
    - gochecknoglobals
    - gochecknoinits
    - godox
    - gomnd
    - lll
    - nlreturn
    - paralleltest
    - tagliatelle
    - varnamelen
    - wrapcheck
    - wsl

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  govet:
    enable-all: true
    disable:
      # fieldalignment is a memory micro-optimization that reorders struct
      # fields; it fights positional struct literals across this codebase and
      # is not part of go vet's defaults. Keep every other govet analyzer.
      - fieldalignment

  gocyclo:
    min-complexity: 20

  gocognit:
    min-complexity: 30

  dupl:
    threshold: 100

  goconst:
    min-len: 3
    min-occurrences: 3

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style

  gofumpt:
    extra-rules: true

  misspell:
    locale: US
    ignore-words:
      # MITRE (as in the MITRE ATT&CK framework) is a proper noun, not a
      # misspelling of "miter".
      - MITRE
      - mitre

  nolintlint:
    require-explanation: true
    require-specific: true

  revive:
    rules:
      - name: exported
        arguments:
          - "checkPrivateReceivers"
          - "sayRepetitiveInsteadOfStutters"

  stylecheck:
    checks: ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022"]

  gosec:
    excludes:
      - G404
    severity: medium
    confidence: medium

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gocyclo
        - errcheck
        - dupl
        - gosec
        - goconst

    - linters:
        - staticcheck
      text: "SA9003:"

    - linters:
        - lll
      source: "^//go:generate "

  max-issues-per-linter: 0
  max-same-issues: 0
