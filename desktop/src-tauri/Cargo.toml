[package]
name = "db-backup-desktop"
version = "1.0.0"
description = "Database Backup Desktop Application"
authors = ["DB Backup Team"]
license = "MIT"
repository = "https://github.com/yourusername/db-backup"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [ "dialog-all", "fs-all", "notification-all", "shell-open", "system-tray", "updater", "window-all", "global-shortcut-all"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
directories = "5.0"
log = "0.4"
env_logger = "0.11"
auto-launch = "0.5" # Auto-launch on startup

# Platform-specific dependencies
[target.'cfg(target_os = "windows")'.dependencies]
winreg = "0.52" # Windows Registry access

[target.'cfg(target_os = "macos")'.dependencies]
# macOS-specific dependencies would go here (objc, cocoa, etc.)

[target.'cfg(target_os = "linux")'.dependencies]
# Linux-specific dependencies would go here (dbus, etc.)

[features]
# This feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
