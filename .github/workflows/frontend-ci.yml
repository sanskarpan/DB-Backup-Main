name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'desktop/**'
      - 'extensions/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'desktop/**'
      - 'extensions/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  web:
    name: Web — Typecheck & Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm run build

  mobile:
    name: Mobile — Typecheck & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run lint

  desktop:
    name: Desktop — Typecheck & Build (TS only)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  shared:
    name: Shared Packages — Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared/packages/api-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shared/packages/api-client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  extensions:
    name: Extensions — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint Chrome extension
        run: npx eslint extensions/chrome --ext .js --max-warnings 0 || true
      - name: Lint Firefox extension
        run: npx eslint extensions/firefox --ext .js --max-warnings 0 || true
      - name: Lint Edge extension
        run: npx eslint extensions/edge --ext .js --max-warnings 0 || true
      - name: Lint shared extension code
        run: npx eslint extensions/shared --ext .js --max-warnings 0 || true
