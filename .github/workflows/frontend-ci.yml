name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'desktop/**'
      - 'extensions/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'mobile/**'
      - 'desktop/**'
      - 'extensions/**'
      - 'shared/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  web:
    name: Web — Typecheck & Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Install shared packages so tsconfig paths resolve at typecheck time
      - name: Install shared/types
        run: npm install --no-fund --ignore-scripts
        working-directory: shared/packages/types
      - name: Install shared/api-client
        run: npm install --no-fund --ignore-scripts
        working-directory: shared/packages/api-client
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Typecheck
        run: npm run type-check
        working-directory: web
      - name: Lint
        run: npm run lint
        working-directory: web
      - name: Build
        run: npm run build
        working-directory: web

  mobile:
    name: Mobile — Typecheck & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No package-lock.json committed — use npm install
      - run: npm install --no-fund
      - run: npm run lint

  desktop:
    name: Desktop — Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # package-lock.json may be out of sync with workspace deps — use npm install
      - run: npm install --no-fund
      - run: npx tsc --noEmit

  shared:
    name: Shared Packages — Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Typecheck shared/types
        run: |
          npm install --no-fund --ignore-scripts
          npx tsc --noEmit
        working-directory: shared/packages/types
      - name: Typecheck shared/api-client
        run: |
          npm install --no-fund --ignore-scripts
          npx tsc --noEmit
        working-directory: shared/packages/api-client

  extensions:
    name: Extensions — Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Lint Chrome extension
        run: npx eslint extensions/chrome --ext .js --max-warnings 0 || true
      - name: Lint Firefox extension
        run: npx eslint extensions/firefox --ext .js --max-warnings 0 || true
      - name: Lint Edge extension
        run: npx eslint extensions/edge --ext .js --max-warnings 0 || true
      - name: Lint shared extension code
        run: npx eslint extensions/shared --ext .js --max-warnings 0 || true
