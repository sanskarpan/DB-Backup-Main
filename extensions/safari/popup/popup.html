<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DB Backup Manager</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="logo">
      <img src="../icons/icon-48.png" alt="DB Backup Manager">
      <h1>DB Backup Manager</h1>
    </div>
    <div class="status" id="connectionStatus">
      <span class="status-dot" id="statusDot"></span>
      <span class="status-text" id="statusText">Connecting...</span>
    </div>
  </div>

  <!-- Stats Section -->
  <div class="stats" id="statsSection">
    <div class="stat-card">
      <div class="stat-value" id="totalBackups">--</div>
      <div class="stat-label">Total Backups</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="failedBackups">--</div>
      <div class="stat-label">Failed</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="totalSize">--</div>
      <div class="stat-label">Total Size</div>
    </div>
  </div>

  <!-- Quick Actions -->
  <div class="actions">
    <button id="quickBackupBtn" class="btn btn-primary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7 10 12 15 17 10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      Quick Backup
    </button>

    <button id="viewBackupsBtn" class="btn btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
      View Backups
    </button>

    <button id="monitoringBtn" class="btn btn-secondary">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      Monitoring
    </button>
  </div>

  <!-- Recent Backups -->
  <div class="recent-backups">
    <div class="section-header">
      <h2>Recent Backups</h2>
      <button id="refreshBtn" class="icon-btn" title="Refresh">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
      </button>
    </div>

    <div id="backupsList" class="backups-list">
      <div class="loading">Loading backups...</div>
    </div>
  </div>

  <!-- Alerts -->
  <div class="alerts" id="alertsSection" style="display: none;">
    <div class="section-header">
      <h2>Active Alerts</h2>
      <span class="alert-count" id="alertCount">0</span>
    </div>
    <div id="alertsList" class="alerts-list"></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <button id="syncBtn" class="footer-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"></polyline>
        <polyline points="1 20 1 14 7 14"></polyline>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
      </svg>
      <span id="lastSyncText">Never</span>
    </button>

    <button id="settingsBtn" class="footer-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 1v6m0 6v6m8.66-13.66l-5.2 5.2m-2.92 2.92l-5.2 5.2M23 12h-6M7 12H1m21.66 8.66l-5.2-5.2m-2.92-2.92l-5.2-5.2"></path>
      </svg>
      Settings
    </button>

    <button id="dashboardBtn" class="footer-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Dashboard
    </button>
  </div>

  <!-- Not Configured Message -->
  <div id="notConfigured" class="not-configured" style="display: none;">
    <div class="not-configured-content">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="12"></line>
        <line x1="12" y1="16" x2="12.01" y2="16"></line>
      </svg>
      <h3>Not Configured</h3>
      <p>Please configure your API settings to start using the extension.</p>
      <button id="configureBtn" class="btn btn-primary">Configure Now</button>
    </div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
