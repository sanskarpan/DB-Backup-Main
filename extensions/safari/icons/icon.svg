<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle with Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563eb;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dbGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:0.95" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGradient)"/>

  <!-- Database Cylinder (Top) -->
  <ellipse cx="64" cy="40" rx="28" ry="10" fill="url(#dbGradient)" filter="url(#shadow)"/>
  <rect x="36" y="40" width="56" height="32" fill="url(#dbGradient)"/>
  <ellipse cx="64" cy="72" rx="28" ry="10" fill="#c7d2fe"/>
  <ellipse cx="64" cy="72" rx="28" ry="10" fill="url(#dbGradient)" opacity="0.6"/>

  <!-- Database Lines -->
  <line x1="36" y1="50" x2="92" y2="50" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <line x1="36" y1="60" x2="92" y2="60" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>

  <!-- Download Arrow (Backup Symbol) -->
  <g transform="translate(64, 85)">
    <!-- Arrow Circle Background -->
    <circle cx="0" cy="0" r="18" fill="#10b981" filter="url(#shadow)"/>

    <!-- Arrow -->
    <path d="M 0 -8 L 0 6" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <path d="M -6 0 L 0 6 L 6 0" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Arrow Base -->
    <line x1="-8" y1="8" x2="8" y2="8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Highlight Effect -->
  <ellipse cx="64" cy="40" rx="28" ry="10" fill="white" opacity="0.2"/>
  <ellipse cx="64" cy="38" rx="22" ry="6" fill="white" opacity="0.3"/>
</svg>
